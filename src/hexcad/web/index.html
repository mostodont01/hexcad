<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HexCAD</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script type="importmap">
  {"imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }}
</script>
</head>
<body>

<section id="list" class="screen">
  <header>
    <h1><span class="hex">⬢</span> HexCAD</h1>
    <button id="refresh" aria-label="Refresh">↻</button>
  </header>
  <main id="projects"><p class="hint">Loading…</p></main>
</section>

<section id="model" class="screen" hidden>
  <canvas id="canvas"></canvas>
  <header class="float">
    <button id="back" aria-label="Back">‹</button>
    <div class="titles"><h1 id="title"></h1><div id="sub" class="sub"></div></div>
    <button id="fit" aria-label="Fit">⤢</button>
  </header>
  <div id="views">
    <button data-view="iso">Iso</button><button data-view="top">Top</button><button data-view="front">Front</button>
  </div>
  <div id="info" hidden></div>
  <div id="sheet" class="collapsed">
    <button id="handle"><span id="count"></span> features</button>
    <ul id="features"></ul>
  </div>
  <div id="status" hidden></div>
</section>

<script type="module" src="/app.js"></script>
</body>
</html>
